<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="FrameInGoa">
  <!-- Miniature of the PFP frame: green ring, cream keyline, sun disc, palm.
       All geometry, no text — a wordmark would be illegible at 16px anyway. -->
  <circle cx="32" cy="32" r="32" fill="#1E4D2B"/>
  <circle cx="32" cy="32" r="30" fill="none" stroke="#E23B22" stroke-width="3"/>
  <circle cx="32" cy="32" r="21" fill="#FFF3DC"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#FFF3DC" stroke-width="3"/>
  <!-- sun over the horizon -->
  <path d="M32 40a11 11 0 0 1 11-11 11 11 0 0 1-22 0 11 11 0 0 1 11 11z" fill="#F2B705" opacity="0"/>
  <circle cx="32" cy="27" r="8" fill="#F2B705"/>
  <rect x="14" y="33" width="36" height="3" rx="1.5" fill="#E23B22"/>
  <!-- palm: trunk + fronds -->
  <path d="M40 46c-1-6 0-11 2-14l2 1c-2 3-3 8-2 13z" fill="#17130E"/>
  <path d="M42 32c-4-3-8-3-11-1 3 0 6 1 8 3z" fill="#1E4D2B"/>
  <path d="M42 32c4-3 8-3 11-1-3 0-6 1-8 3z" fill="#1E4D2B"/>
  <path d="M42 32c-1-4 0-7 2-9 0 3 0 6-1 9z" fill="#1E4D2B"/>
</svg>
