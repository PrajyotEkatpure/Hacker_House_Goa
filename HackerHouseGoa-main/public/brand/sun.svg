<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Half sun with rays"><title>Half sun with rays</title><!-- Dome: centre (32,46), r=20. Every ray is the same base rect (the 3 o'clock ray, radius 22.5 to 31.5) rotated about (32,46) in 30 deg steps, so all seven are equal length and genuinely point at the sun's centre. Furthest corner sits 31.6 from the centre, inside the 32 of half the viewBox, so nothing clips. --><g fill="#F2B705"><path d="M32 26a20 20 0 0 1 20 20H12a20 20 0 0 1 20-20z"/><rect x="54.5" y="43.5" width="9" height="5" rx="2.5"/><rect x="54.5" y="43.5" width="9" height="5" rx="2.5" transform="rotate(-30 32 46)"/><rect x="54.5" y="43.5" width="9" height="5" rx="2.5" transform="rotate(-60 32 46)"/><rect x="54.5" y="43.5" width="9" height="5" rx="2.5" transform="rotate(-90 32 46)"/><rect x="54.5" y="43.5" width="9" height="5" rx="2.5" transform="rotate(-120 32 46)"/><rect x="54.5" y="43.5" width="9" height="5" rx="2.5" transform="rotate(-150 32 46)"/><rect x="54.5" y="43.5" width="9" height="5" rx="2.5" transform="rotate(-180 32 46)"/><rect x="6" y="52" width="52" height="5" rx="2.5"/></g></svg>
