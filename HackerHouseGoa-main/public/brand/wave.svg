<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 24" width="240" height="24" role="img" aria-label="Wave rule" preserveAspectRatio="none"><title>Repeating wave rule</title><!-- Tiles horizontally: the band enters at (0,9)/(0,15) and leaves at (240,9)/(240,15) with the identical tangent (15,-8), so seams are invisible. Two 120-wide S curves. The 6-thick band peaks at y=3 and troughs at y=21, so the whole shape stays inside the 24-high viewBox and is centred on it. preserveAspectRatio="none" so it can be stretched as a rule; drop that attribute if it is ever used at its intrinsic size. --><path d="M0 9 C15 1 45 1 60 9 C75 17 105 17 120 9 C135 1 165 1 180 9 C195 17 225 17 240 9 L240 15 C225 23 195 23 180 15 C165 7 135 7 120 15 C105 23 75 23 60 15 C45 7 15 7 0 15 Z" fill="#FFF3DC"/></svg>
